[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-annotator"
version = "0.2.0"
requires-python = ">=3.11"
description = "Independent annotation ballots with explicit validation and bounded majority resolution"

[tool.setuptools.packages.find]
include = ["local_annotator*"]
